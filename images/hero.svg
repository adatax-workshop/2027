<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Illustration: an update raises the target task but lowers OOD generalization, calibration, robustness, safety and retention">
  <defs>
    <linearGradient id="gain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e11d48" stop-opacity=".70"/>
      <stop offset="1" stop-color="#be123c" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <style>
    .lbl{font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#4b5563}
    .mono{font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing:.06em}
  </style>

  <text x="40" y="34" class="mono" fill="#6b7280">ONE UPDATE, TWO LEDGERS</text>

  <!-- baseline -->
  <line x1="60" y1="210" x2="600" y2="210" stroke="#0b1220" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="40" y="196" class="mono" fill="#0f766e" text-anchor="start" transform="rotate(-90 40 196)">GAIN</text>
  <text x="40" y="226" class="mono" fill="#be123c" text-anchor="end" transform="rotate(-90 40 226)">TAX</text>

  <!-- gain -->
  <rect x="90" y="62" width="56" height="148" rx="8" fill="url(#gain)"/>
  <line x1="164" y1="92" x2="152" y2="92" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
  <polyline points="157,87 152,92 157,97" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="96" class="mono" fill="#0f766e">what gets reported</text>

  <!-- tax -->
  <rect x="176" y="210" width="56" height="78"  rx="8" fill="url(#tax)"/>
  <rect x="262" y="210" width="56" height="104" rx="8" fill="url(#tax)"/>
  <rect x="348" y="210" width="56" height="60"  rx="8" fill="url(#tax)"/>
  <rect x="434" y="210" width="56" height="118" rx="8" fill="url(#tax)"/>
  <rect x="520" y="210" width="56" height="88"  rx="8" fill="url(#tax)"/>

  <polyline points="178,186 178,176 574,176 574,186" fill="none" stroke="#be123c" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="376" y="164" class="mono" fill="#be123c" text-anchor="middle">what gets paid: the adaptation tax</text>

  <!-- labels -->
  <text x="118" y="372" class="lbl" text-anchor="middle">Target<tspan x="118" dy="17">task</tspan></text>
  <text x="204" y="372" class="lbl" text-anchor="middle">OOD<tspan x="204" dy="17">general.</tspan></text>
  <text x="290" y="372" class="lbl" text-anchor="middle">Calibration</text>
  <text x="376" y="372" class="lbl" text-anchor="middle">Robustness</text>
  <text x="462" y="372" class="lbl" text-anchor="middle">Safety</text>
  <text x="548" y="372" class="lbl" text-anchor="middle">Retention</text>
</svg>
